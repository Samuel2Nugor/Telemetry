[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["ssl://mosquitto:8883"]
  tls_ca = "/etc/telemetry/certs/ca.crt"
  insecure_skip_verify = false
  topics = ["telemetry/v1/devices/+/telemetry/validated/+"]
  username = "${TELEGRAF_MQTT_USERNAME}"
  password = "${TELEGRAF_MQTT_PASSWORD}"
  client_id = "telemetry-telegraf"
  qos = 1
  persistent_session = true
  connection_timeout = "30s"
  max_reconnect_interval = "30s"
  topic_tag = ""
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name_path = "measurement"
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05Z07:00"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "sensor_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "unit"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "schema_version"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sequence"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "uptime_ms"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "boot_id"
      type = "string"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
  timeout = "5s"