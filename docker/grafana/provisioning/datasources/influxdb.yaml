apiVersion: 1

prune: true

datasources:
  - name: Telemetry InfluxDB
    uid: telemetry-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: $INFLUXDB_BUCKET
      tlsSkipVerify: false
    secureJsonData:
      token: $INFLUXDB_TOKEN